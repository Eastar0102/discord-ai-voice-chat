  }
  text { font-family: -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif; }
</style><rect class="bg" width="980" height="506" rx="8"/><text class="t1" x="24" y="34" font-size="17" font-weight="600">Latency fixes, before and after</text><text class="t2" x="24" y="54" font-size="13">Seconds, log scale · each row measured on the same hardware through the real code path</text><circle class="s2" cx="730" cy="72" r="6"/><text class="t2" x="742" y="76" font-size="12.5">before</text><circle class="s1" cx="810" cy="72" r="6"/><text class="t2" x="822" y="76" font-size="12.5">after</text><line class="grid" x1="430.0" y1="84" x2="430.0" y2="454"/><text class="t3" x="430.0" y="472" font-size="12" text-anchor="middle">0.2 s</text><line class="grid" x1="521.4" y1="84" x2="521.4" y2="454"/><text class="t3" x="521.4" y="472" font-size="12" text-anchor="middle">0.5 s</text><line class="grid" x1="590.6" y1="84" x2="590.6" y2="454"/><text class="t3" x="590.6" y="472" font-size="12" text-anchor="middle">1 s</text><line class="grid" x1="659.8" y1="84" x2="659.8" y2="454"/><text class="t3" x="659.8" y="472" font-size="12" text-anchor="middle">2 s</text><line class="grid" x1="751.2" y1="84" x2="751.2" y2="454"/><text class="t3" x="751.2" y="472" font-size="12" text-anchor="middle">5 s</text><line class="grid" x1="820.4" y1="84" x2="820.4" y2="454"/><text class="t3" x="820.4" y="472" font-size="12" text-anchor="middle">10 s</text><line class="grid" x1="889.5" y1="84" x2="889.5" y2="454"/><text class="t3" x="889.5" y="472" font-size="12" text-anchor="middle">20 s</text><text class="t1" x="24" y="106" font-size="13.5">Cold first turn → warm-up at startup</text><text class="t3" x="24" y="122" font-size="11.5">first reply after launch</text><line class="conn" x1="662.7" y1="109" x2="870.3" y2="109"/><circle class="s2 ring" cx="870.3" cy="109" r="6.5"/><circle class="s1 ring" cx="662.7" cy="109" r="6.5"/><text class="t2" x="881.3" y="113" font-size="12">16.5</text><text class="t2" x="651.7" y="113" font-size="12" text-anchor="end">2.06</text><text class="t1" x="24" y="152" font-size="13.5">Keep vision model loaded → release after each look</text><text class="t3" x="24" y="168" font-size="11.5">felt latency per reply</text><line class="conn" x1="687.9" y1="155" x2="852.8" y2="155"/><circle class="s2 ring" cx="852.8" cy="155" r="6.5"/><circle class="s1 ring" cx="687.9" cy="155" r="6.5"/><text class="t2" x="863.8" y="159" font-size="12">13.84</text><text class="t2" x="676.9" y="159" font-size="12" text-anchor="end">2.65</text><text class="t1" x="24" y="198" font-size="13.5">Concurrent TTS requests → one at a time</text><text class="t3" x="24" y="214" font-size="11.5">14-char chunk synthesis (concurrent: 13–30 s, sequential: 1.1–1.5 s)</text><line class="conn" x1="631.1" y1="201" x2="846.6" y2="201"/><circle class="s2 ring" cx="846.6" cy="201" r="6.5"/><circle class="s1 ring" cx="631.1" cy="201" r="6.5"/><text class="t2" x="857.6" y="205" font-size="12">13</text><text class="t2" x="620.1" y="205" font-size="12" text-anchor="end">1.5</text><text class="t1" x="24" y="244" font-size="13.5">Default batch → -ub 4096 (llama.cpp, MoE on CPU)</text><text class="t3" x="24" y="260" font-size="11.5">time to first token</text><line class="conn" x1="686.0" y1="247" x2="801.8" y2="247"/><circle class="s2 ring" cx="801.8" cy="247" r="6.5"/><circle class="s1 ring" cx="686.0" cy="247" r="6.5"/><text class="t2" x="812.8" y="251" font-size="12">8.3</text><text class="t2" x="675.0" y="251" font-size="12" text-anchor="end">2.6</text><text class="t1" x="24" y="290" font-size="13.5">Sentence-only → comma chunking</text><text class="t3" x="24" y="306" font-size="11.5">worst first-chunk synthesis</text><line class="conn" x1="712.7" y1="293" x2="764.3" y2="293"/><circle class="s2 ring" cx="764.3" cy="293" r="6.5"/><circle class="s1 ring" cx="712.7" cy="293" r="6.5"/><text class="t2" x="775.3" y="297" font-size="12">5.7</text><text class="t2" x="701.7" y="297" font-size="12" text-anchor="end">3.4</text><text class="t1" x="24" y="336" font-size="13.5">Original layout → cache-friendly prompt layout</text><text class="t3" x="24" y="352" font-size="11.5">time to first token (MoE)</text><line class="conn" x1="637.5" y1="339" x2="685.6" y2="339"/><circle class="s2 ring" cx="685.6" cy="339" r="6.5"/><circle class="s1 ring" cx="637.5" cy="339" r="6.5"/><text class="t2" x="696.6" y="343" font-size="12">2.59</text><text class="t2" x="626.5" y="343" font-size="12" text-anchor="end">1.6</text><text class="t1" x="24" y="382" font-size="13.5">Cache layout + prefetch while user speaks</text><text class="t3" x="24" y="398" font-size="11.5">time to first token (MoE, real path)</text><line class="conn" x1="491.4" y1="385" x2="685.6" y2="385"/><circle class="s2 ring" cx="685.6" cy="385" r="6.5"/><circle class="s1 ring" cx="491.4" cy="385" r="6.5"/><text class="t2" x="696.6" y="389" font-size="12">2.59</text><text class="t2" x="480.4" y="389" font-size="12" text-anchor="end">0.37</text><text class="t1" x="24" y="428" font-size="13.5">No prefetch → prefetch partial transcript</text><text class="t3" x="24" y="444" font-size="11.5">first chunk ready (local 8B)</text><line class="conn" x1="530.9" y1="431" x2="596.4" y2="431"/><circle class="s2 ring" cx="596.4" cy="431" r="6.5"/><circle class="s1 ring" cx="530.9" cy="431" r="6.5"/><text class="t2" x="607.4" y="435" font-size="12">1.06</text><text class="t2" x="519.9" y="435" font-size="12" text-anchor="end">0.55</text></svg>
