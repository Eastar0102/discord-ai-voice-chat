<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 506" width="980" height="506" role="img" aria-label="Latency fixes, before and after"><style>
  .bg { fill: #fcfcfb; }
  .t1 { fill: #0b0b0b; } .t2 { fill: #52514e; } .t3 { fill: #8a8984; }
  .grid { stroke: #e6e5e1; stroke-width: 1; }
  .axis { stroke: #c9c8c2; stroke-width: 1; }
  .s1 { fill: #2a78d6; } .s1s { stroke: #2a78d6; }
  .s2 { fill: #eb6834; } .s2s { stroke: #eb6834; }
  .ring { stroke: #fcfcfb; stroke-width: 2; }
  .conn { stroke: #b9b8b1; stroke-width: 2; }
  .thr { stroke: #8a8984; stroke-width: 1.5; stroke-dasharray: 4 4; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #1a1a19; }
